[security_eval]
# 服务器地址（仅 IP:端口，不含 http/https 前缀）
# 程序会自动拼接 https://SERVERIPPORT 作为完整 URL
SERVERIPPORT = 192.168.17.253:443

# 用户身份凭证（对应服务器端的 USER_ID）
USER_ID =

# HTTP 策略查询服务监听地址
# 格式: IP:PORT
listen_addr = 127.0.0.1:50050

# 是否启用本模块 (true/false)
enabled = true

# 心跳间隔（秒），向服务器发送心跳包的频率
heartbeat_interval = 30

# 控制列表刷新间隔（秒），定期从服务器拉取准入控制列表
control_list_interval = 30

# 客户端下载地址，用于下发客户端安装包 URL
client_download_url =

# 设备信息（用于设备认证 /v1/device/auth）
dev_uid =
macid =
ips = 127.0.0.1
VERSION = 3.0.1
os = Linux
