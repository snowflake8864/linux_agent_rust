[workspace]
resolver = "2"
members = [
    "crates/main",
    "crates/kernel_module",
    "crates/hostinfo",
     #"crates/md5",
     "crates/common",
     "crates/net_client",
     "crates/online",
     "crates/task",
     "crates/netlink",
     #"crates/kernel_event",
     "crates/system_metrics",
     "crates/logging",
     "crates/pattern",
     "crates/reporter",
     "crates/zcopy_mgr",
     "crates/process_mgr",
     "crates/procinfo",
     "crates/netblock",
     #"crates/udisk",
     #"crates/docker",
     "crates/snapman",
     "crates/rules_jump_mgr",
     "crates/agent_manager",
    "crates/grpc_gateway",
    "crates/agent_local_svc",
    "crates/ebpf_backend",
]

[profile.dev]
opt-level = 0
debug = 1
codegen-units = 4
lto = false
incremental = true
#panic = 'unwind'
debug-assertions = true
overflow-checks = false
rpath = false

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
lto = true
incremental = false
#panic = 'unwind'
#panic = "abort"
debug-assertions = false
overflow-checks = false
rpath = false
#strip = true

[profile.test]
opt-level = 0
debug = 1
#codegen-units = 16
lto = false
incremental = true
debug-assertions = true
overflow-checks = true
rpath = false

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = true
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[profile.release-with-debug]
inherits = "release"
debug = true
opt-level = 2  # 稍微降低优化级别增加稳定性
lto = false   # 禁用LTO避免mips64链接问题

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"
