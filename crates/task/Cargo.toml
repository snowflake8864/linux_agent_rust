[package]
name = "task"
version = "0.10.6"
edition = "2021"
resolver = "2"

[dependencies]
#ring = { version = "0.17" }
tokio = { version = "1.23", features = ["net", "macros", "fs", "io-util"] }
#tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
arc-swap = "1.6.0"
configparser = "3.1.0"  # 选择适合的版本
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-derive = "0.3"
num-traits = "0.2"
chrono = "0.4"
once_cell = "1.19"
futures = "0.3"
zip = { version = "0.6", features = ["deflate", "bzip2", "time"] }
net_client = { path = "../net_client" }
common = { path =  "../common" }
hostinfo = { path =  "../hostinfo" }
config = { path = "../config"} 
logging = { path = "../logging" }
reporter = { path = "../reporter" }
log = "0.4"
pattern = { path = "../pattern" }
process_mgr = { path =  "../process_mgr" }
netlink = { path = "../netlink" }
netblock = {path = "../netblock"}
udisk = {path = "../udisk"}
local_store = { path = "../local_store" }
procinfo = { path = "../procinfo" }
snapman = { path = "../snapman"}
rules_jump_mgr = { path = "../rules_jump_mgr"}
libc = "0.2"
ntp = "0.5"
uuid = "1"
grpc_gateway = { path = "../grpc_gateway" }
[features]
test_mode = []

