[package]
name = "security_eval_server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "security_eval_server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.37", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }