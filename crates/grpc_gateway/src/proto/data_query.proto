syntax = "proto3";
package data_query;

import "common.proto";
import "peripheral_policy.proto";

service DataQueryService {
    rpc GetProcessList(ProcessFilter) returns (ProcessList);
    rpc GetPortList(common.Empty) returns (PortList);
    rpc GetUsbDeviceList(ProcessFilter) returns (UsbDeviceList);
    // 扫描系统可执行文件目录（/bin /usr/bin /usr/sbin /usr/local/bin /usr/lib/systemd），
    // 返回路径、MD5及策略状态，结果按 MD5 去重
    rpc GetExecutableList(ProcessFilter) returns (ExecutableList);
}

message ProcessFilter {
    int32 limit = 1;
    string sort_by = 2;
    // 按策略状态过滤: 0=全部(默认), 1=白名单, 2=黑名单, 3=未知(未在名单中)
    int32 filter_status = 3;
}

message ProcessInfo {
    int32 pid = 1;
    string name = 2;
    string exe_path = 3;
    string hash = 4;
    string cpu_usage = 5;
    string mem_usage = 6;
    string user = 7;
    PolicyStatus policy_status = 8;
}

message ProcessList {
    repeated ProcessInfo processes = 1;
}

message PortInfo {
    string protocol = 1;
    uint32 port = 2;
    string process_name = 3;
    int32 pid = 4;
}

message PortList {
    repeated PortInfo ports = 1;
}

message UsbDeviceList {
    repeated peripheral_policy.UsbDevice devices = 1;
}

// 策略状态枚举
enum PolicyStatus {
    POLICY_NONE = 0;      // 未在黑白名单中
    POLICY_WHITELIST = 1; // 白名单（允许）
    POLICY_BLACKLIST = 2; // 黑名单（拦截）
}

// 单个可执行文件信息
message ExecutableInfo {
    string path = 1;                 // 完整路径，如 /usr/bin/ls
    string hash = 2;                 // MD5 値
    PolicyStatus policy_status = 3;  // 当前黑白名单状态
}

// 可执行文件列表
message ExecutableList {
    repeated ExecutableInfo executables = 1;
    int32 total = 2;    // 扫描到的总文件数（去重前）
    int32 unique = 3;   // 去重后的数量
}
