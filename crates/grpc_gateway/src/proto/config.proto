syntax = "proto3";
package config;

import "common.proto";
import "google/protobuf/wrappers.proto";

service ConfigService {
    rpc GetConfig(common.Empty) returns (ConfigData);
    rpc UpdateConfig(ConfigData) returns (ConfigResponse);
}

// 对应 Rust: config::net_info::NetInfoConfig
// ★ 使用 google.protobuf Wrapper 类型替代 optional（兼容 protoc 3.6.x）
// prost 0.14 自动映射: BoolValue→Option<bool>, UInt32Value→Option<u32>, StringValue→Option<String>
// 未设置的字段 gRPC 不更新（真正部分更新）
// 字段名与 JSON key 一致（snake_case，兼容服务器下发的 JSON key）
message ConfigData {
    google.protobuf.UInt32Value crontime = 1;
    google.protobuf.BoolValue file_switch = 2;
    google.protobuf.BoolValue proc_switch = 3;
    google.protobuf.BoolValue extortion_protect = 4;
    google.protobuf.BoolValue extortion_switch = 5;
    google.protobuf.BoolValue file_protect = 6;
    google.protobuf.BoolValue self_protect_switch = 7;
    google.protobuf.BoolValue open_port_switch = 8;
    google.protobuf.BoolValue dynamic_switch = 9;
    google.protobuf.BoolValue proc_protect = 10;
    google.protobuf.BoolValue usb_protect = 11;
    google.protobuf.BoolValue usb_switch = 12;
    google.protobuf.BoolValue syslog_inner_switch = 13;
    google.protobuf.BoolValue syslog_outer_switch = 14;
    google.protobuf.BoolValue syslog_dns_switch = 15;
    google.protobuf.BoolValue internet_switch = 16;
    google.protobuf.BoolValue syslog_process_switch = 17;
    google.protobuf.BoolValue syslog_login_switch = 18;
    google.protobuf.BoolValue outreach_switch = 19;
    google.protobuf.BoolValue baseline_switch = 20;
    google.protobuf.BoolValue hardware_switch = 21;
    google.protobuf.UInt32Value logproto = 22;
    google.protobuf.UInt32Value logsent = 23;
    google.protobuf.UInt32Value debug_switch = 24;
    google.protobuf.UInt32Value module_switch = 25;
    google.protobuf.UInt32Value outreach_time = 26;
    google.protobuf.UInt32Value baseline_time = 27;
    google.protobuf.UInt32Value hardware_time = 28;
    google.protobuf.StringValue logipport = 29;
    google.protobuf.BoolValue alert_push = 30;
}

message ConfigResponse {
    bool success = 1;
    string message = 2;
}
