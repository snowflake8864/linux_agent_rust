syntax = "proto3";

package virus_scan;

// ============================================================================
// 病毒扫描 gRPC 服务定义
// ============================================================================
// 本服务提供病毒扫描功能，使用双向流式 RPC 实现实时通信
// 终端 A 通过此接口控制 Agent 执行病毒扫描任务，并接收实时进度和告警
// ============================================================================

service VirusScanService {
    // StreamControl: 双向流式 RPC，用于扫描任务的全生命周期管理
    // 
    // 客户端（终端 A）可以发送:
    //   - StartScanRequest: 启动扫描任务
    //   - StopScanRequest: 停止正在运行的扫描
    //   - PauseScanRequest: 暂停正在运行的扫描
    //   - ResumeScanRequest: 恢复已暂停的扫描
    //   - Ping: 心跳检测
    //   - DisposeFileRequest: 处置感染文件（隔离/删除）
    //
    // 服务端（Agent）会推送:
    //   - StartScanResponse: 扫描启动确认
    //   - ScanProgress: 扫描进度更新（实时）
    //   - VirusAlert: 病毒告警（发现病毒时）
    //   - ScanCompleted: 扫描完成通知
    //   - ScanError: 错误信息
    //   - Pong: 心跳响应
    //   - DisposeFileResponse: 处置操作结果
    //   - PauseScanResponse: 暂停操作结果
    //   - ResumeScanResponse: 恢复操作结果
    rpc StreamControl(stream ClientMessage) returns (stream ServerMessage);

    // 查询隔离区文件列表
    rpc ListQuarantine(QuarantineQuery) returns (QuarantineList);
}

// ============================================================================
// 客户端消息（终端 A 发送给 Agent）
// ============================================================================
message ClientMessage {
    oneof cmd {
        StartScanRequest start_scan = 1;  // 启动扫描任务
        StopScanRequest stop_scan = 2;    // 停止扫描任务
        Ping ping = 3;                     // 心跳检测
        DisposeFileRequest dispose_file = 4; // 处置感染文件（隔离/删除）
        PauseScanRequest pause_scan = 5;   // 暂停扫描任务
        ResumeScanRequest resume_scan = 6; // 恢复扫描任务
    }
}

// ============================================================================
// 服务端消息（Agent 推送给终端 A）
// ============================================================================
message ServerMessage {
    oneof event {
        StartScanResponse start_response = 1;  // 扫描启动响应
        ScanProgress progress = 2;             // 扫描进度更新（周期性推送）
        VirusAlert virus_alert = 3;            // 病毒告警（发现病毒时立即推送）
        ScanCompleted completed = 4;           // 扫描完成通知
        ScanError error = 5;                   // 错误通知
        Pong pong = 6;                         // 心跳响应
        FileScanResult file_scan_result = 7;   // 单个文件扫描结果（实时推送）
        DisposeFileResponse dispose_result = 8; // 处置操作结果
        PauseScanResponse pause_response = 9;  // 暂停操作结果
        ResumeScanResponse resume_response = 10; // 恢复操作结果
    }
}

// ============================================================================
// 启动扫描请求（由终端 A 发起）
// ============================================================================
message StartScanRequest {
    string target = 1;                  // 扫描目标目录（例: "/home/user/data" 或 "/" 全盘）
    repeated string exclude_dirs = 2;   // 排除的子目录列表（例: ["/proc", "/sys", "/tmp"]）
    bool include_script = 3;            // 是否扫描脚本文件（.sh, .py, .pl 等）
    bool full_disk = 4;                 // 是否全盘扫描（true 时忽略 target）
}

// ============================================================================
// 扫描启动响应（Agent 返回）
// ============================================================================
message StartScanResponse {
    bool success = 1;      // 是否成功启动
    string scan_id = 2;    // 扫描任务 ID（UUID 格式，用于后续操作）
    string message = 3;    // 响应消息（成功: "扫描已启动"，失败: 错误描述）
}

// ============================================================================
// 停止扫描请求（由终端 A 发起）
// ============================================================================
message StopScanRequest {
    string scan_id = 1;    // 要停止的扫描任务 ID
}

// ============================================================================
// 暂停扫描请求（由终端 A 发起）
// ============================================================================
// 暂停后，当前正在扫描的文件会扫完，后续文件暂不提交给引擎
message PauseScanRequest {
    string scan_id = 1;    // 要暂停的扫描任务 ID
}

// ============================================================================
// 暂停扫描响应（Agent 返回）
// ============================================================================
message PauseScanResponse {
    string scan_id = 1;    // 扫描任务 ID
    bool success = 2;      // 是否成功暂停
    string message = 3;    // 响应消息
}

// ============================================================================
// 恢复扫描请求（由终端 A 发起）
// ============================================================================
message ResumeScanRequest {
    string scan_id = 1;    // 要恢复的扫描任务 ID
}

// ============================================================================
// 恢复扫描响应（Agent 返回）
// ============================================================================
message ResumeScanResponse {
    string scan_id = 1;    // 扫描任务 ID
    bool success = 2;      // 是否成功恢复
    string message = 3;    // 响应消息
}

// ============================================================================
// 扫描进度通知（Agent 周期性推送）
// ============================================================================
// Agent 每扫描 10 个文件后发送一次进度更新
message ScanProgress {
    string scan_id = 1;          // 扫描任务 ID
    int32 scanned = 2;           // 已扫描文件数
    int32 total = 3;             // 总文件数（可能为 0，因为无法预知目录文件数）
    int32 viruses_found = 4;     // 已发现病毒数量
    string current_path = 5;     // 当前正在扫描的文件路径
}

// ============================================================================
// 病毒告警（Agent 发现病毒时立即推送）
// ============================================================================
// 当 ClamAV 检测到病毒时，Agent 立即发送此告警
message VirusAlert {
    string scan_id = 1;        // 扫描任务 ID
    string file_path = 2;      // 病毒文件完整路径
    string virus_name = 3;     // 病毒名称（由 ClamAV 返回，如 "Eicar-Signature"）
    string md5 = 4;            // 文件 MD5 值（可选，ClamAV 模式下为空）
    string threat_level = 5;   // 威胁级别（LOW/MEDIUM/HIGH/CRITICAL）
    int64 detected_at = 6;     // 检测时间戳（毫秒）
    string file_size = 7;      // 文件大小（可选，用于显示）
}

// ============================================================================
// 单个文件扫描结果（每扫描一个文件立即推送）
// ============================================================================
// 用于实时显示每个文件的扫描结果，格式如：/path/to/file: OK 或 /path/to/file: VirusName
message FileScanResult {
    string scan_id = 1;           // 扫描任务 ID
    string file_path = 2;         // 文件完整路径
    string status = 3;            // 扫描状态：OK / VIRUS / ERROR
    string virus_name = 4;        // 病毒名称（status=VIRUS 时有值）
    string error_message = 5;     // 错误信息（status=ERROR 时有值）
    int64 scan_time_ms = 6;       // 扫描耗时（毫秒）
    int64 scanned_at = 7;         // 扫描时间戳（毫秒）
}

// ============================================================================
// 扫描完成通知（Agent 在扫描结束后发送）
// ============================================================================
message ScanCompleted {
    string scan_id = 1;        // 扫描任务 ID
    int32 total_scanned = 2;   // 总共扫描的文件数
    int32 viruses_found = 3;   // 总共发现的病毒数
    int64 duration_ms = 4;     // 扫描耗时（毫秒）
}

// ============================================================================
// 扫描错误通知（Agent 在遇到错误时发送）
// ============================================================================
message ScanError {
    string scan_id = 1;    // 扫描任务 ID
    string code = 2;       // 错误代码（START_FAILED/OPEN_DIR_FAILED 等）
    string message = 3;    // 错误详细描述
}

// ============================================================================
// 心跳检测（由终端 A 发起）
// ============================================================================
message Ping {
    int64 timestamp = 1;   // 发送时间戳（毫秒）
}

// ============================================================================
// 心跳响应（Agent 返回）
// ============================================================================
message Pong {
    int64 timestamp = 1;   // 原始时间戳（用于计算延迟）
}

// ============================================================================
// 处置动作枚举
// ============================================================================
enum DisposeAction {
    DISPOSE_ACTION_UNSPECIFIED = 0;
    MOVE = 1;    // 移动到隔离目录
    REMOVE = 2;  // 删除感染文件
    RESTORE = 3; // 从隔离目录还原文件
}
message DisposeFileRequest {
    string scan_id = 1;        // 扫描任务 ID（处置操作不依赖此字段，可填空串）
    string file_path = 2;      // 要处置的文件完整路径（RESTORE 时见上方约定）
    DisposeAction action = 3;   // 处置动作：MOVE（隔离）或 REMOVE（删除）
    string quarantine_dir = 4;  // 隔离目录（action=MOVE 时需要，如 "/opt/vigilixav/quarantine"）
}

// ============================================================================
// 处置操作结果（Agent 返回）
// ============================================================================
message DisposeFileResponse {
    string scan_id = 1;        // 扫描任务 ID
    string file_path = 2;      // 被处置的文件路径
    DisposeAction action = 3;   // 执行的动作
    bool success = 4;          // 是否成功
    string message = 5;        // 结果描述（成功: "MOVED OK / REMOVED OK"，失败: 错误原因）
}

// 隔离区查询
message QuarantineQuery {
    string filter = 1;         // 空=全部未还原, "all"=含已还原, "virus:xxx"=按病毒名
}

message QuarantineEntry {
    int64  id = 1;
    uint64 dev = 2;
    uint64 ino = 3;
    string original_path = 4;
    string quar_name = 5;
    string virus_name = 6;
    uint32 uid = 7;
    uint32 gid = 8;
    uint32 mode = 9;
    uint64 file_size = 10;
    string quarantined_at = 11;
    bool   restored = 12;
    string restored_at = 13;
}

message QuarantineList {
    repeated QuarantineEntry entries = 1;
    int32 total = 2;
}
