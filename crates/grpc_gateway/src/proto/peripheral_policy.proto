syntax = "proto3";
package peripheral_policy;

import "common.proto";

service PeripheralPolicyService {
    rpc GetPeripheralPolicy(PeripheralPolicyFilter) returns (PeripheralPolicy);
    rpc UpdatePeripheralPolicy(PeripheralPolicy) returns (common.SimpleResponse);
}

// 查询过滤条件：指定获取白名单还是黑名单
message PeripheralPolicyFilter {
    int32 is_white = 1;  // 1=白名单, 0=黑名单
}

// 对应 Rust: udisk::device::UsbInfo
// 复用 handler: SHARED_USB_LIST.update_whitelist() / update_blacklist()
message UsbDevice {
    string peripheral_eid = 1;
    string peripheral_name = 2;
    string intro = 3;
    string type_ = 4;
    bool allow = 5;
    int32 policy_status = 6;  // 0=未知, 1=白名单, 2=黑名单 (PolicyStatus 枚举)
}

message PeripheralPolicy {
    repeated UsbDevice devices = 1;
    int32 action = 2;  // 0=移除(未知), 1=白名单, 2=黑名单
}
