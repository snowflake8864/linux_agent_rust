syntax = "proto3";
package alert;

import "common.proto";

service AlertService {
    // 订阅实时告警流，客户端启动后保持连接持续接收
    rpc SubscribeAlerts(AlertFilter) returns (stream AlertEvent);

    // 查询历史告警日志（分页），客户端初始化时调用一次完成历史补读
    rpc GetAlertLogs(AlertLogQuery) returns (AlertLogResponse);

    // 处置告警：标记为已处理或已忽略
    rpc HandleAlert(AlertHandleRequest) returns (AlertHandleResponse);
}

message AlertFilter {
    AlertType type = 1;
}

enum AlertType {
    ALERT_UNKNOWN = 0;
    PROCESS_ALERT = 1;
    FILE_ALERT = 2;
    DEVICE_ALERT = 3;
    NETWORK_ALERT = 4;
    RANSOMWARE_ALERT = 5;
}

// 对应 Rust: reporter::AuditLogInfo
message AlertEvent {
    string alert_id = 1;
    AlertType type = 2;
    uint32 level = 3;
    uint64 timestamp = 4;
    string file_path = 5;
    string process_name = 6;
    string md5 = 7;
    string remark = 8;
    string peripheral_name = 9;
    string peripheral_eid = 10;
    string rename_dir = 11;
    string p_param = 12;
    uint32 n_type = 13;  // 原始事件类型码 (对应 AuditLogInfo.n_type)
}

// 历史告警查询请求
message AlertLogQuery {
    // 处置状态过滤: -1=全部 0=未处理 1=已处理 2=已忽略
    // 默认 -1 返回全部
    int32  handle_status = 1;
    uint32 page          = 2; // 页码，从 1 开始
    uint32 page_size     = 3; // 每页条数，默认 20
}

// 历史告警查询响应
message AlertLogResponse {
    repeated AlertLogItem items = 1; // 当前页数据
    int32 total                = 2; // 符合条件的总条数（用于客户端分页展示）
}

// 单条历史告警记录
message AlertLogItem {
    int64  id                  = 1;  // 自增主键
    int32  alert_type          = 2;  // 大类: 1=进程 2=文件 3=外设 4=网络 5=勒索
    int32  level               = 3;  // 告警级别
    string process             = 4;  // 触发进程名
    string path                = 5;  // 进程或文件完整路径
    int32  pid                 = 6;  // 进程 ID
    string detail              = 7;  // 告警详情描述
    int32  handle_status       = 8;  // 0=未处理 1=已处理 2=已忽略
    string handle_status_label = 9;  // 处置状态文字，客户端直接显示
    string handle_user         = 10; // 执行处置的用户名
    string handled_at          = 11; // 处置时间
    string created_at          = 12; // 告警产生时间
    uint32 n_type              = 13; // 原始事件类型码，与 AlertEvent.n_type 对应
}

// 告警处置请求
message AlertHandleRequest {
    int64  id            = 1; // 告警记录 ID（AlertLogItem.id）
    int32  handle_status = 2; // 1=已处理 2=已忽略
    string handle_user   = 3; // 执行处置的用户名
}

// 告警处置响应
message AlertHandleResponse {
    bool   success  = 1; // 是否成功
    string message  = 2; // 结果描述
    int32  affected = 3; // 影响行数
}
