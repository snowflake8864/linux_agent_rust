syntax = "proto3";

package security_scan;

// ============================================================================
// 系统安全检测 gRPC 服务定义
// ============================================================================
// 终端 A 通过此接口控制 Agent 执行 /opt/osec/SecurityScan_linux.sh 系统安全
// 检测脚本，并将检测结果以流式方式实时返回。
//
// 由于脚本执行时间较长（逐项检测，每项间隔 0.5s，约 8~30s），采用服务端
// 流式 RPC：服务端启动脚本后立即返回，随后按检测项逐条推送进度，最后推送
// 汇总结果，避免客户端长时间阻塞等待。
// ============================================================================

service SecurityScanService {
    // RunScan: 启动一次系统安全检测，服务端流式返回检测进度与结果
    rpc RunScan(RunSecurityScanRequest) returns (stream SecurityScanEvent);
}

// ============================================================================
// 启动检测请求（由终端 A 发起）
// ============================================================================
message RunSecurityScanRequest {
    string output_dir = 1;  // HTML 报告输出目录（留空默认 /tmp）
}

// ============================================================================
// 单个检测项结果
// ============================================================================
message SecurityCheckItem {
    string level = 1;        // 等级：SAFE / WARNING / CRITICAL
    string description = 2;  // 检测描述
}

// ============================================================================
// 检测已启动（服务端收到请求并成功拉起脚本后立即推送）
// ============================================================================
message ScanStarted {
    string message = 1;
}

// ============================================================================
// 检测进度（每完成一个检测项推送一次）
// ============================================================================
message ScanProgress {
    int32 checked = 1;          // 已完成的检测项数量
    SecurityCheckItem item = 2; // 本条检测结果
}

// ============================================================================
// 检测完成汇总
// ============================================================================
message ScanCompleted {
    bool success = 1;       // 脚本是否正常结束
    string message = 2;     // 结果描述（成功/退出码）
    string report_file = 3; // HTML 报告完整路径
    int32 safe_count = 4;   // 安全项数量
    int32 warning_count = 5; // 警告项数量
    int32 critical_count = 6; // 危险项数量
    int32 score = 7;        // 安全评分（0~100）
}

// ============================================================================
// 检测失败（脚本无法启动/执行异常）
// ============================================================================
message ScanFailed {
    string message = 1;
}

// ============================================================================
// 服务端事件流（terminal A 接收）
// ============================================================================
message SecurityScanEvent {
    oneof event {
        ScanStarted started = 1;
        ScanProgress progress = 2;
        ScanCompleted completed = 3;
        ScanFailed failed = 4;
    }
}
