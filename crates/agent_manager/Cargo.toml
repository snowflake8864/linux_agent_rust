[package]
name = "agent_manager"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "MagicArmorAgent"
path = "src/main.rs"
[dependencies]
tokio = { version = "1.37", features = ["full"] }
#tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
logging = { path = "../logging" }
log = "0.4"

rustls-native-certs = "0.7"   
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
webpki-roots = "0.26"
fs2 = "0.4"
scopeguard = "1.2"
