[package]
name = "reporter"
version = "0.10.6"
edition = "2021"
resolver = "2" 

[dependencies]
libc = "0.2"
once_cell = "1.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
logging = { path =  "../logging" }
log = "0.4"
zcopy_mgr = { path = "../zcopy_mgr" }
common = { path =  "../common" }
net_client = { path = "../net_client" }
#process_md5_cache = { path =  "../process_md5_cache" }
process_mgr = { path =  "../process_mgr" }
