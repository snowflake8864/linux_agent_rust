[package]
name = "udisk"
version = "0.1.0"
edition = "2021"
description = "A Rust crate for monitoring and controlling USB devices using libusb."
license = "MIT"
keywords = ["usb", "monitor", "libusb", "security"]
categories = ["hardware-support", "os"]

[dependencies]
once_cell = "1"
rusb = "0.9"
md5 = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = { path = "../config"} 
tokio = { version = "1", features = ["full"] }
logging = { path = "../logging" }
log = "0.4"
common = { path =  "../common" }
reporter = { path = "../reporter"}
net_client = { path = "../net_client" }

