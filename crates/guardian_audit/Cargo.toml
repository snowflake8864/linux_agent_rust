[package]
name = "guardian_audit"
version = "0.10.6"
edition = "2021"
resolver = "2"

[[bin]]
name = "security-evaluator"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.23", features = ["macros", "net", "time", "rt-multi-thread", "signal"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
configparser = "3.0"
net_client = { path = "../net_client" }
common   = { path = "../common" }
config   = { path = "../config" }
logging  = { path = "../logging" }
log = "0.4"
libc = "0.2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
hex = "0.4"
