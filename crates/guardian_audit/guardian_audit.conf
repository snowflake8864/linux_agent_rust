# Security Evaluator Configuration
# 安全评估模块配置文件

[security_eval]
# 是否启用模块
enabled = true

# 安全策略 HTTP 服务监听地址
listen_addr = 127.0.0.1:50050

# 心跳间隔（秒）
heartbeat_interval = 30

# 控制列表刷新间隔（秒）
control_list_interval = 30

# 客户端下载地址
client_download_url = http://example.com/client

# 服务器基础 URL（如果为空，则从 net_info.ini 读取）
server_base_url =
