syntax = "proto3";

package lynis_scan;

// ============================================================================
// Lynis 系统漏洞扫描 gRPC 服务定义
// ============================================================================
// 本服务提供 Linux 系统安全审计功能，使用双向流式 RPC 实现实时通信
// 终端 A 通过此接口触发 Lynis 扫描，Agent 执行扫描并实时推送进度
// 扫描完成后返回完整的漏洞报告（警告、建议、SSH/内核配置问题）
// ============================================================================

service LynisScanService {
    // StreamControl: 双向流式 RPC，用于扫描任务的全生命周期管理
    //
    // 客户端（终端 A）可以发送:
    //   - StartLynisScanRequest: 启动 Lynis 扫描任务
    //   - StopLynisScanRequest: 停止正在运行的扫描
    //   - LynisPing: 心跳检测
    //
    // 服务端（Agent）会推送:
    //   - LynisStartResponse: 扫描启动确认
    //   - LynisScanProgress: 扫描进度更新（周期性推送）
    //   - LynisScanCompleted: 扫描完成通知（包含完整报告）
    //   - LynisScanError: 错误信息
    //   - LynisPong: 心跳响应
    rpc StreamControl(stream LynisClientMessage) returns (stream LynisServerMessage);
}

// ============================================================================
// 客户端消息（终端 A 发送给 Agent）
// ============================================================================
message LynisClientMessage {
    oneof cmd {
        StartLynisScanRequest start_scan = 1;  // 启动扫描任务
        StopLynisScanRequest stop_scan = 2;    // 停止扫描任务
        LynisPing ping = 3;                     // 心跳检测
    }
}

// ============================================================================
// 服务端消息（Agent 推送给终端 A）
// ============================================================================
message LynisServerMessage {
    oneof event {
        LynisStartResponse start_response = 1;   // 扫描启动响应
        LynisScanProgress progress = 2;          // 扫描进度更新
        LynisScanCompleted completed = 3;        // 扫描完成通知
        LynisScanError error = 4;                // 错误通知
        LynisPong pong = 5;                      // 心跳响应
    }
}

// ============================================================================
// 启动扫描请求（由终端 A 发起）
// ============================================================================
message StartLynisScanRequest {
    bool quick_mode = 1;  // 是否使用快速模式（--quick 参数，跳过部分测试）
}

// ============================================================================
// 停止扫描请求（由终端 A 发起）
// ============================================================================
message StopLynisScanRequest {
    string scan_id = 1;  // 要停止的扫描任务 ID
}

// ============================================================================
// 扫描启动响应（Agent 返回）
// ============================================================================
message LynisStartResponse {
    bool success = 1;      // 是否成功启动
    string scan_id = 2;    // 扫描任务 ID（UUID 格式）
    string message = 3;    // 响应消息
}

// ============================================================================
// 扫描进度通知（Agent 周期性推送）
// ============================================================================
message LynisScanProgress {
    string scan_id = 1;           // 扫描任务 ID
    int32 progress_percent = 2;   // 进度百分比（0-100）
    string current_test = 3;      // 当前正在执行的测试名称
    string status_text = 4;       // 状态描述文本
}

// ============================================================================
// 扫描完成通知（Agent 在扫描结束后发送）
// ============================================================================
message LynisScanCompleted {
    string scan_id = 1;                    // 扫描任务 ID
    int32 hardening_index = 2;             // 系统加固指数（0-100）
    int32 warning_count = 3;               // 警告数量
    int32 suggestion_count = 4;            // 建议数量
    repeated LynisWarning warnings = 5;    // 警告列表
    repeated LynisSuggestion suggestions = 6;  // 建议列表
    repeated LynisDetail details = 7;      // 详细配置问题（SSH/内核等）
    string report_raw = 8;                 // 原始报告内容（可选）
    int64 duration_ms = 9;                 // 扫描耗时（毫秒）
}

// ============================================================================
// 单个警告信息
// ============================================================================
message LynisWarning {
    string test_id = 1;    // 测试 ID（如 KRNL-5830）
    string message = 2;    // 警告消息
    string detail = 3;     // 详细信息
}

// ============================================================================
// 单个建议信息
// ============================================================================
message LynisSuggestion {
    string test_id = 1;         // 测试 ID（如 AUTH-9262）
    string message = 2;         // 建议消息
    string remediation = 3;     // 修复建议
}

// ============================================================================
// 详细配置问题（SSH、内核等）
// ============================================================================
message LynisDetail {
    string test_id = 1;              // 测试 ID（如 SSH-7408）
    string service = 2;              // 服务类型（ssh/kernel 等）
    string field = 3;                // 配置字段名
    string current_value = 4;        // 当前值
    string recommended_value = 5;    // 建议值
}

// ============================================================================
// 扫描错误通知（Agent 在遇到错误时发送）
// ============================================================================
message LynisScanError {
    string scan_id = 1;    // 扫描任务 ID
    string code = 2;       // 错误代码（START_FAILED/SCAN_FAILED/PARSE_FAILED 等）
    string message = 3;    // 错误详细描述
}

// ============================================================================
// 心跳检测（由终端 A 发起）
// ============================================================================
message LynisPing {
    int64 timestamp = 1;   // 发送时间戳（毫秒）
}

// ============================================================================
// 心跳响应（Agent 返回）
// ============================================================================
message LynisPong {
    int64 timestamp = 1;   // 原始时间戳（用于计算延迟）
}
