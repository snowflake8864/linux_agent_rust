syntax = "proto3";

package vuln_scan;

// ============================================================================
// 漏洞扫描服务 - 接收外部应用推送的漏洞数据并转发给服务器
// ============================================================================
service VulnScanService {
    // 接收漏洞列表并转发给服务器
    rpc PutVulnScan(PutVulnScanRequest) returns (PutVulnScanResponse);
}

// ============================================================================
// 漏洞列表请求
// ============================================================================
message PutVulnScanRequest {
    string start_at = 1;           // 扫描开始时间 (2026-02-24 11:16:58)
    string end_at = 2;             // 扫描结束时间 (2026-02-24 12:01:10)
    int32 vuln_total = 3;           // 漏洞总计
    repeated Vulnerability vuln_list = 4;  // 漏洞列表
}

// ============================================================================
// 单个漏洞信息
// ============================================================================
message Vulnerability {
    string title = 1;
    string severity = 2;
    string file_path = 3;
}

// ============================================================================
// 响应
// ============================================================================
message PutVulnScanResponse {
    bool success = 1;
    string message = 2;
}
