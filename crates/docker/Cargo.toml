
[package]
name = "docker"
version = "0.10.6"
edition = "2021"
resolver = "2"

[dependencies]
tokio = { version = "1.23", features = ["net", "macros", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
once_cell = "1"
num-derive = "0.3"
num-traits = "0.2"
common = { path =  "../common" }
config = { path = "../config"} 
logging = { path = "../logging" }
log = "0.4"
