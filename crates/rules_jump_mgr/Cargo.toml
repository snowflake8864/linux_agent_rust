[package]
name = "rules_jump_mgr"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time"] }
ipnet = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
logging = { path = "../logging" }
log = "0.4"
net_client = { path = "../net_client" }
serde_json = "1.0"
futures = "0.3"
