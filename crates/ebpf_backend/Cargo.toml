[package]
name = "ebpf_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = "0.12"
aya-log = "0.2"
log = "0.4"
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
walkdir = "2.4"
md5 = "0.7"
hex = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
common = { path = "../common" }
reporter = { path = "../reporter" }
logging = { path = "../logging" }
local_store = { path = "../local_store" }
