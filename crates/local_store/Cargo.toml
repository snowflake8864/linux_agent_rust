[package]
name = "local_store"
version = "0.1.0"
edition = "2021"
description = "业务数据 SQLite 持久化层 — 告警日志、策略黑白名单、跳变状态等"

[dependencies]
sqlite_db = { path = "../sqlite_db" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
log = "0.4"
logging = { path = "../logging" }
config = { path = "../config" }
