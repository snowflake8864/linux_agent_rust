[package]
name = "logging"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4"
env_logger = "0.10"
chrono = "0.4"
fs_extra = "1.3"
serde = { version = "1.0", features = ["derive"] } # 用于 JSON 解析
serde_json = "1.0" # 用于 JSON 处理
tokio = { version = "1.0", features = ["fs", "time"] } # 用于异步文件操作
