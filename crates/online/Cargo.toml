[package]
name = "online"
version = "0.10.6"
edition = "2021"
resolver = "2" 

[dependencies]
libc = "0.2"
get_if_addrs = "0.5"
tokio = { version = "1.23", features = ["net", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hostinfo = { path = "../hostinfo" }
net_client = { path = "../net_client" }
common = { path = "../common" }
